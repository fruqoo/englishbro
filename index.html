<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Learning Games</title>
<style>
  :root{
    --bg1:#111827; --bg2:#1e293b; --card:#ffffff; --card-dim:#e7e9ee;
    --team1:#3568a8; --team1-dark:#254a7a;
    --team2:#a3454a; --team2-dark:#7c3236;
    --ink:#1f2430; --muted:#667085; --accent:#a9762f; --green:#2f8f57; --green-dark:#1f6e42;
    --purple:#6d5b9e; --purple-dark:#4f4174; --orange:#b17036; --orange-dark:#8a5628;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Segoe UI',Verdana,Arial,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink); padding:20px;
  }
  #app{max-width:1200px;margin:0 auto;}
  h1{color:#fff;text-align:center;margin:0 0 6px;font-size:1.6em;font-weight:700;}
  .subtitle{color:#aab4c8;text-align:center;margin:0 0 24px;font-size:.95em;}
  .card{
    background:var(--card); border-radius:12px; padding:24px;
    box-shadow:0 4px 18px rgba(0,0,0,.16); border:1px solid rgba(15,23,42,.04);
  }
  .center-card{max-width:640px;margin:40px auto;text-align:center;}
  button{
    font-family:inherit; font-size:1em; font-weight:600; cursor:pointer;
    border:none; border-radius:8px; padding:12px 22px; transition:transform .1s, filter .1s;
  }
  button:hover:not(:disabled){filter:brightness(1.06); transform:translateY(-1px);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-blue{background:var(--team1); color:#fff;}
  .btn-red{background:var(--team2); color:#fff;}
  .btn-green{background:var(--green); color:#fff;}
  .btn-gray{background:#e5e7eb; color:#374151;}
  .btn-dark{background:#374151; color:#fff;}
  .field{margin-bottom:14px; text-align:left;}
  .field label{display:block; font-size:.85em; font-weight:600; color:var(--muted); margin-bottom:4px;}
  .field input{
    width:100%; padding:10px 12px; border:2px solid #e5e7eb; border-radius:8px;
    font-size:1em; font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media (max-width:700px){ .setup-grid{grid-template-columns:1fr;} }
  .team-box{border-radius:12px; padding:18px;}
  .team-box.t1{background:#eff6ff; border:2px solid var(--team1);}
  .team-box.t2{background:#fef2f2; border:2px solid var(--team2);}
  .team-box h3{margin-top:0;}
  .char-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px; margin:18px 0;
  }
  .badges{font-size:.68em; color:var(--muted); margin-top:2px; line-height:1.3;}
  .char-card{
    background:var(--card-dim); border-radius:12px; padding:10px 6px; text-align:center;
    cursor:pointer; border:3px solid transparent; transition:all .12s; position:relative;
  }
  .char-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .char-card.selected{border-color:var(--green); background:#dcfce7;}
  .char-card.eliminated{opacity:.28; filter:grayscale(1);}
  .char-card.eliminated::after{
    content:"✕"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.4em; color:#dc2626; font-weight:bold;
  }
  .char-card.out-pick{border-color:var(--team2); background:#fee2e2;}
  .char-card .name{font-size:.85em; font-weight:600; margin-top:4px;}
  .top-bar{display:grid; grid-template-columns:1fr auto 1fr; gap:16px; align-items:stretch; margin-bottom:18px;}
  @media (max-width:640px){
    .top-bar{grid-template-columns:1fr;}
    .top-bar .turn-panel{order:-1;}
  }
  .team-panel{border-radius:14px; padding:16px; color:#fff; text-align:center; min-height:150px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .team-panel.t1{background:linear-gradient(160deg,var(--team1),var(--team1-dark));}
  .team-panel.t2{background:linear-gradient(160deg,var(--team2),var(--team2-dark));}
  .team-panel.active{box-shadow:0 0 0 4px var(--accent);}
  .team-panel .players{font-size:.8em; opacity:.9; margin-top:2px;}
  .hidden-box{opacity:.55;}
  .hidden-box .q-mark{font-size:2.6em; line-height:1;}
  .turn-banner{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; text-align:center; min-width:180px;
  }
  .turn-banner .big{font-size:1.3em; font-weight:800;}
  .timer{font-size:1.5em; font-weight:800; color:#fff; margin-top:6px; font-variant-numeric:tabular-nums;}
  .timer-warning{color:#fbbf24; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
  .question-banner{
    background:#fffbeb; border:2px dashed var(--accent); border-radius:12px;
    padding:14px 18px; margin-bottom:16px; text-align:center; font-size:1.15em; font-weight:700;
    color:#92400e;
  }
  .action-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; justify-content:center;}
  .category-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; justify-content:center;}
  .tab{padding:8px 14px; border-radius:20px; background:#e5e7eb; font-size:.85em; font-weight:600; cursor:pointer;}
  .tab.active{background:var(--accent); color:#3f2d00;}
  .swatches{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:14px;}
  .swatch{
    width:52px; height:52px; border-radius:50%; border:3px solid transparent; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:1.4em;
  }
  .swatch.selected{border-color:#111; transform:scale(1.1);}
  .swatch-label{font-size:.65em; text-align:center; display:block; margin-top:2px; color:var(--muted);}
  .swatch-wrap{text-align:center;}
  .panel-title{text-align:center; font-weight:700; margin:0 0 10px; color:var(--muted); text-transform:uppercase; font-size:.8em; letter-spacing:.05em;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
    justify-content:center; z-index:50;
  }
  .modal{background:#fff; border-radius:16px; padding:28px; max-width:420px; text-align:center;}
  .footer-actions{display:flex; justify-content:center; gap:12px; margin-top:20px;}
  .small-link{background:var(--card-dim); color:var(--ink); text-decoration:none; font-weight:600; font-size:.85em; padding:8px 14px; border-radius:8px;}
  .small-link:hover:not(:disabled){background:#dde1e8;}
  .avatar-lg{width:120px;}
  .winner-banner{font-size:2em; text-align:center; margin-bottom:10px;}
  .reveal-circle{
    width:90px; height:90px; border-radius:50%; display:inline-flex; align-items:center;
    justify-content:center; color:#fff; font-size:2.6em; cursor:pointer; user-select:none;
    transition:transform .12s; box-shadow:0 6px 16px rgba(0,0,0,.25);
  }
  .reveal-circle:hover{transform:scale(1.05);}
  .question-preview{text-align:center; font-weight:600; color:var(--ink); margin-bottom:14px; min-height:1.3em;}

  /* ---------- Mode select ---------- */
  .mode-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-top:8px;}
  .mode-card{
    background:#fff; border-radius:10px; padding:26px 20px; text-align:center; cursor:pointer;
    border:1px solid #e5e7eb; transition:transform .12s, border-color .12s, box-shadow .12s; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .mode-card:hover{transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 16px rgba(0,0,0,.1);}
  .mode-card .mode-icon{font-size:1.7em; opacity:.85;}
  .mode-card h2{margin:10px 0 6px; font-size:1.25em;}
  .mode-card p{color:var(--muted); font-size:.88em; margin:0; line-height:1.5;}

  /* ---------- What Am I? (charades mode) ---------- */
  .cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px;}
  .category-card{
    border-radius:12px; padding:18px 10px; text-align:center; cursor:pointer;
    border:2px solid #e5e7eb; background:#f9fafb; transition:transform .12s, border-color .12s;
  }
  .category-card:hover{transform:translateY(-2px);}
  .category-card .icon{font-size:2em;}
  .category-card .cat-name{font-weight:700; margin-top:6px;}
  .category-card .cat-hint{font-size:.78em; color:var(--muted);}
  .category-card.cat-people.selected{border-color:var(--purple); background:#f5f3ff;}
  .category-card.cat-animals.selected{border-color:var(--green); background:#f0fdf4;}
  .category-card.cat-objects.selected{border-color:var(--orange); background:#fff7ed;}
  .category-card.cat-mixed.selected{border-color:var(--team1); background:#eff6ff;}

  .hu-prep-ring{
    width:150px; height:150px; border-radius:50%; margin:14px auto 4px;
    display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--ppct,100)*1%), #e5e7eb 0);
  }
  .hu-prep-ring .inner{
    width:124px; height:124px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:3.2em; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;
  }
  .hu-timer-ring{
    width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:conic-gradient(var(--accent) calc(var(--tpct,100)*1%), #e5e7eb 0); flex-shrink:0;
  }
  .hu-timer-ring.low{background:conic-gradient(var(--team2) calc(var(--tpct,100)*1%), #e5e7eb 0);}
  .hu-timer-ring .inner{
    width:52px; height:52px; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-variant-numeric:tabular-nums;
  }
  .hu-word-stage{min-height:180px; display:flex; align-items:center; justify-content:center; margin:14px 0 20px; padding:0 8px;}
  .hu-word{font-size:clamp(2rem,7vw,3.2rem); font-weight:800; text-align:center; color:var(--ink); text-wrap:balance;}
  .hu-word.pop{animation:huPop .22s ease;}
  @keyframes huPop{ from{opacity:0; transform:scale(.88);} to{opacity:1; transform:scale(1);} }
  .hu-answer-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .hu-ans-btn{
    padding:22px 10px; border-radius:12px; font-weight:800; font-size:1.15em; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; color:#fff;
  }
  .hu-ans-btn .mark{font-size:1.5em; line-height:1;}
  .hu-ans-btn.pass{background:linear-gradient(160deg,var(--team2),var(--team2-dark));}
  .hu-ans-btn.hit{background:linear-gradient(160deg,var(--green),var(--green-dark));}
  .hu-lists{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; width:100%;}
  @media (max-width:600px){ .hu-lists{grid-template-columns:1fr;} }
  .hu-list-card{border-radius:12px; padding:14px 16px; background:#f9fafb; border:2px solid #e5e7eb; text-align:left;}
  .hu-list-card h4{margin:0 0 8px; font-size:.78em; letter-spacing:.05em; text-transform:uppercase; color:var(--muted);}
  .hu-list-card.good h4{color:var(--green);}
  .hu-list-card.bad h4{color:var(--team2);}
  .hu-chip-wrap{display:flex; flex-wrap:wrap; gap:6px;}
  .hu-chip{font-size:.8em; padding:4px 10px; border-radius:999px; background:#fff; border:1px solid #e5e7eb; color:var(--ink);}

  .hu-tilt-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .hu-tilt-gauge{
    position:relative; width:74px; height:220px; border-radius:37px;
    background:linear-gradient(to bottom, var(--team2) 0%, #e5e7eb 42%, #e5e7eb 58%, var(--green) 100%);
  }
  .hu-tilt-gauge .marker{
    position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px;
    background:#fff; border:3px solid var(--ink); border-radius:50%; transition:top .05s linear;
  }
  .hu-tilt-gauge .tilt-label{
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:.68em; font-weight:800; color:#fff; letter-spacing:.03em;
  }
  .hu-tilt-gauge .tilt-label.top{top:8px;}
  .hu-tilt-gauge .tilt-label.bottom{bottom:8px;}
  .hu-tilt-hint{color:var(--muted); font-size:.85em; text-align:center; max-width:32ch; margin:0;}

  /* ---------- Projection / big-screen mode ---------- */
  body.projection-mode .subtitle{display:none;}
  body.projection-mode h1{font-size:2.3em;}
  body.projection-mode .card{padding:34px;}
  body.projection-mode .question-banner{font-size:1.9em; padding:24px 26px; line-height:1.35;}
  body.projection-mode .panel-title{font-size:1.05em;}
  body.projection-mode .turn-banner .big{font-size:1.7em;}
  body.projection-mode .timer{font-size:2.3em;}
  body.projection-mode .hu-word{font-size:clamp(3.2rem,11vw,5.5rem);}
  body.projection-mode .hu-timer-ring{width:88px; height:88px;}
  body.projection-mode .hu-timer-ring .inner{width:76px; height:76px; font-size:1.3em;}

  /* ---------- Simon Says ---------- */
  .simon-reveal{animation:simonReveal .25s ease;}
  @keyframes simonReveal{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }
  .streak-badge{display:inline-block; margin-left:3px; color:var(--accent); font-weight:700;}
  .hu-timer-ring.low{animation:pulse .5s infinite;}
  .result-banner{font-weight:700; text-align:center;}
  .result-banner.pass{background:#dcfce7; border-color:var(--green); color:#14532d;}
  .result-banner.fail{background:#fee2e2; border-color:#dc2626; color:#7f1d1d;}

  /* ---------- Confetti (win celebration) ---------- */
  .confetti-piece{
    position:fixed; top:-12px; width:9px; height:16px; opacity:.95; pointer-events:none; z-index:500;
    animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards;
  }
  @keyframes confettiFall{
    from{ transform:translateY(0) rotate(0deg); opacity:1; }
    to{ transform:translateY(105vh) rotate(var(--rot,360deg)); opacity:0; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Data ---------- */
const EYE_COLORS   = {blue:"#4a90d9", green:"#4caf6d", brown:"#7c4a24", gray:"#9aa1a8"};
const HAIR_COLORS  = {black:"#2b2420", brown:"#6b4226", blonde:"#e8c568", red:"#a94a34", gray:"#b7bac0"};
const CLOTH_COLORS = {red:"#e74c3c", blue:"#3b82f6", green:"#22a35e", yellow:"#f1c40f", purple:"#8b5cf6", orange:"#f0883e"};
const SKIN_COLORS  = {light:"#ffdfc0", medium:"#dba876", tan:"#c68a54", dark:"#8d5a34"};

/* hasHair:false => hair:"none" (bald). All other boolean traits are independent. */
const CHARACTERS = [
  {id:1, name:"Alex",   eyes:"blue",  hasHair:true,  hair:"black",  cloth:"red",    skin:"light",
    hasMustache:false, hasBeard:false, hasGlasses:true,  hasHat:false, hasFreckles:false, hasEarrings:false, isTall:false, isChubby:false},
  {id:2, name:"Ben",    eyes:"green", hasHair:true,  hair:"brown",  cloth:"blue",   skin:"medium",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:true,  hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:false},
  {id:3, name:"Clara",  eyes:"brown", hasHair:true,  hair:"blonde", cloth:"green",  skin:"tan",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:true,  isTall:false, isChubby:false},
  {id:4, name:"Diana",  eyes:"gray",  hasHair:true,  hair:"red",    cloth:"yellow", skin:"dark",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:true,  hasEarrings:false, isTall:true,  isChubby:true},
  {id:5, name:"Ethan",  eyes:"blue",  hasHair:true,  hair:"gray",   cloth:"purple", skin:"medium",
    hasMustache:true,  hasBeard:true,  hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:true},
  {id:6, name:"Fiona",  eyes:"green", hasHair:true,  hair:"black",  cloth:"orange", skin:"light",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:true,  hasEarrings:false, isTall:false, isChubby:false},
  {id:7, name:"George", eyes:"brown", hasHair:false, hair:"none",   cloth:"blue",   skin:"tan",
    hasMustache:false, hasBeard:false, hasGlasses:true,  hasHat:false, hasFreckles:false, hasEarrings:false, isTall:false, isChubby:true},
  {id:8, name:"Hannah", eyes:"gray",  hasHair:true,  hair:"blonde", cloth:"red",    skin:"dark",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:true,  hasFreckles:false, hasEarrings:true,  isTall:true,  isChubby:false},
  {id:9, name:"Ian",    eyes:"blue",  hasHair:true,  hair:"brown",  cloth:"green",  skin:"light",
    hasMustache:true,  hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:false},
  {id:10,name:"Julia",  eyes:"green", hasHair:true,  hair:"red",    cloth:"yellow", skin:"medium",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:true,  isTall:false, isChubby:true},
  {id:11,name:"Kevin",  eyes:"brown", hasHair:false, hair:"none",   cloth:"purple", skin:"tan",
    hasMustache:true,  hasBeard:true,  hasGlasses:true,  hasHat:false, hasFreckles:true,  hasEarrings:false, isTall:true,  isChubby:true},
  {id:12,name:"Laura",  eyes:"gray",  hasHair:true,  hair:"black",  cloth:"orange", skin:"dark",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:false, isTall:false, isChubby:false},
  {id:13,name:"Mia",    eyes:"green", hasHair:true,  hair:"blonde", cloth:"red",    skin:"tan",
    hasMustache:false, hasBeard:false, hasGlasses:true,  hasHat:false, hasFreckles:true,  hasEarrings:true,  isTall:false, isChubby:false},
  {id:14,name:"Noah",   eyes:"brown", hasHair:true,  hair:"brown",  cloth:"purple", skin:"light",
    hasMustache:false, hasBeard:true,  hasGlasses:false, hasHat:true,  hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:false},
  {id:15,name:"Olivia", eyes:"gray",  hasHair:false, hair:"none",   cloth:"green",  skin:"medium",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:true,  isTall:false, isChubby:true},
  {id:16,name:"Peter",  eyes:"brown", hasHair:false, hair:"none",   cloth:"yellow", skin:"medium",
    hasMustache:true,  hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:false},
  {id:17,name:"Sophia", eyes:"blue",  hasHair:true,  hair:"brown",  cloth:"red",    skin:"light",
    hasMustache:false, hasBeard:false, hasGlasses:true,  hasHat:false, hasFreckles:true,  hasEarrings:true,  isTall:false, isChubby:false},
  {id:18,name:"Marcus", eyes:"gray",  hasHair:false, hair:"none",   cloth:"blue",   skin:"dark",
    hasMustache:false, hasBeard:true,  hasGlasses:false, hasHat:true,  hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:true},
  {id:19,name:"Elena",  eyes:"green", hasHair:true,  hair:"red",    cloth:"purple", skin:"tan",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:false, hasEarrings:false, isTall:true,  isChubby:false},
  {id:20,name:"Victor", eyes:"blue",  hasHair:true,  hair:"black",  cloth:"green",  skin:"light",
    hasMustache:false, hasBeard:false, hasGlasses:false, hasHat:false, hasFreckles:true,  hasEarrings:false, isTall:false, isChubby:true},
];

function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* type "color": player picks a value, question is built from it.
   type "bool": no value to pick — the question is fixed, the app reveals the true answer. */
const CATEGORIES = [
  {key:"eyes",  label:"Eye Color",       type:"color", options:EYE_COLORS,
    question:v=>`Does your character have ${cap(v)} eyes?`},
  {key:"hair",  label:"Hair Color",      type:"color", options:HAIR_COLORS,
    question:v=>`Does your character have ${cap(v)} hair?`},
  {key:"cloth", label:"Clothing Color",  type:"color", options:CLOTH_COLORS,
    question:v=>`Is your character wearing ${cap(v)} clothes?`},
  {key:"skin",  label:"Skin Tone",       type:"color", options:SKIN_COLORS,
    question:v=>`Does your character have ${cap(v)} skin?`},
  {key:"hasHair",     label:"Hair?",       type:"bool", question:()=>"Does your character have hair?"},
  {key:"hasMustache", label:"Mustache?",   type:"bool", question:()=>"Does your character have a mustache?"},
  {key:"hasBeard",    label:"Beard?",      type:"bool", question:()=>"Does your character have a beard?"},
  {key:"hasGlasses",  label:"Glasses?",    type:"bool", question:()=>"Does your character wear glasses?"},

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${sec.toString().padStart(2,"0")}`;
}

/* ---------- "What Am I?" round logic ---------- */
const TILT_THRESHOLD = 35; // degrees of tilt (from calibrated neutral) needed to trigger an answer
const TILT_RELEASE = 12;   // must return within this range of neutral before the next tilt can trigger
const TILT_MAX = 60;       // degrees mapped to the full travel of the on-screen gauge
let huOrientationHandler = null;

function huRequestTiltPermission(){
  return new Promise(resolve=>{
    if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
      DeviceOrientationEvent.requestPermission().then(res=> resolve(res === "granted")).catch(()=> resolve(false));
    } else if(typeof DeviceOrientationEvent !== "undefined"){
      resolve(true);
    } else {
      resolve(false);
    }
  });
}

function huUpdateTiltGauge(adjusted){
  const marker = document.getElementById("huTiltMarker");
  if(!marker) return;
  const clamped = Math.max(-TILT_MAX, Math.min(TILT_MAX, adjusted));
  marker.style.top = (50 - (clamped/TILT_MAX)*50) + "%";
}

function huAttachTilt(){
  huDetachTilt();
  huOrientationHandler = function(e){
    if(e.beta === null || e.beta === undefined) return;
    const hu = state.headsup;
    if(hu.tiltNeutral === null){
      hu.tiltNeutral = e.beta; // calibrate: whatever angle they're holding it at right now is "neutral"
      clearTimeout(hu.tiltFallbackTimer);
      return;
    }
    const dir = hu.tiltSwap ? -1 : 1;
    const adjusted = (e.beta - hu.tiltNeutral) * dir;
    huUpdateTiltGauge(adjusted);
    if(hu.tiltLocked){
      if(Math.abs(adjusted) < TILT_RELEASE) hu.tiltLocked = false;
      return;
    }
    if(adjusted <= -TILT_THRESHOLD){
      hu.tiltLocked = true;
      huAnswer(true);
    } else if(adjusted >= TILT_THRESHOLD){
      hu.tiltLocked = true;
      huAnswer(false);
    }
  };
  window.addEventListener("deviceorientation", huOrientationHandler);
}
function huDetachTilt(){
  if(huOrientationHandler){
    window.removeEventListener("deviceorientation", huOrientationHandler);
    huOrientationHandler = null;
  }
}

function huClearTimer(){ if(huTimerInterval){ clearInterval(huTimerInterval); huTimerInterval = null; } }
function huClearPrep(){ if(huPrepInterval){ clearInterval(huPrepInterval); huPrepInterval = null; } }

function huNextWord(){
  const hu = state.headsup;
  if(hu.poolIdx >= hu.pool.length){
    hu.pool = shuffle(WHAT_AM_I_WORDS[hu.category]);
    hu.poolIdx = 0;
  }
  hu.currentWord = hu.pool[hu.poolIdx++];
}

function huUpdateTimerDisplay(){
  const hu = state.headsup;
  const ring = document.getElementById("huTimerRing");
  const num = document.getElementById("huTimerNum");
  if(!ring || !num) return;
  num.textContent = hu.timeLeft;
  ring.style.setProperty("--tpct", Math.max(0, (hu.timeLeft/hu.duration)*100));
  ring.classList.toggle("low", hu.timeLeft<=10);
}

function huTickTimer(){
  const hu = state.headsup;
  hu.timeLeft--;
  huUpdateTimerDisplay();
  if(hu.timeLeft<=0){
    huClearTimer();
    huEndRound();
  }
}

function huRunPrep(){
  huClearPrep();
  huPrepInterval = setInterval(()=>{
    state.headsup.prepCount--;
    if(state.headsup.prepCount<=0){
      huClearPrep();
      huStartRound();
      return;
    }
    render();
  }, 1000);
}

function huStartRound(){
  const hu = state.headsup;
  hu.pool = shuffle(WHAT_AM_I_WORDS[hu.category]);
  hu.poolIdx = 0;
  hu.score = 0;
  hu.hits = [];
  hu.misses = [];
  hu.timeLeft = hu.duration;
  hu.prepCount = null;
  hu.tiltNeutral = null;
  hu.tiltLocked = false;
  huNextWord();
  state.screen = "huGame";
  render();
  huClearTimer();
  huTimerInterval = setInterval(huTickTimer, 1000);
  if(hu.controlMode === "tilt"){
    huAttachTilt();
    clearTimeout(hu.tiltFallbackTimer);
    hu.tiltFallbackTimer = setTimeout(()=>{
      if(hu.controlMode==="tilt" && hu.tiltNeutral===null){
        huDetachTilt();
        hu.controlMode = "buttons";
        hu.tiltUnavailable = true;
        render();
      }
    }, 4000);
  }
}

function huAnswer(correct){
  const hu = state.headsup;
  const w = hu.currentWord;
  if(correct){
    hu.score++;
    hu.hits.push(w);
    playSound("correct");
  } else {
    hu.misses.push(w);
    playSound("wrong");
  }
  if(hu.timeLeft > 0){ huNextWord(); render(); }
}

function huEndRound(){
  huDetachTilt();
  clearTimeout(state.headsup.tiltFallbackTimer);
  state.screen = "huResults";
  render();
}

/* ---------- Simon Says mode logic ---------- */
let simonTimerInterval = null;
function simonClearTimer(){ if(simonTimerInterval){ clearInterval(simonTimerInterval); simonTimerInterval = null; } }

function simonAlivePlayers(){ return state.simon.players.filter(p=>p.alive); }

const KIND_ICON = {physical:"🏃", say:"🗣️", translate:"🔄"};

function simonBuildCommand(){
  const kind = ["physical","say","translate"][Math.floor(Math.random()*3)];
  const round = state.simon.round || 1;
  /* trap chance climbs from ~22% to 50% as rounds go on — the further you get, the riskier it gets */
  const trapChance = Math.min(0.5, 0.22 + round*0.018);
  const simonSays = Math.random() >= trapChance;
  let mainText, sub = null, answerText = null;
  const icon = KIND_ICON[kind];

  if(kind==="physical"){
    const action = SIMON_PHYSICAL[Math.floor(Math.random()*SIMON_PHYSICAL.length)];
    const phrase = `${cap(action)}!`;
    mainText = simonSays ? `${icon} Simon Says: "${phrase}"` : `${icon} "${phrase}"`;
  } else if(kind==="say"){
    const pair = SIMON_PHRASES[Math.floor(Math.random()*SIMON_PHRASES.length)];
    mainText = simonSays ? `${icon} Simon Says: Say this in English:` : `${icon} Say this in English:`;
    sub = `"${pair.tr}"`;
    answerText = pair.en;
  } else {
    const pair = SIMON_PHRASES[Math.floor(Math.random()*SIMON_PHRASES.length)];
    mainText = simonSays ? `${icon} Simon Says: Translate this to Turkish:` : `${icon} Translate this to Turkish:`;
    sub = `"${pair.en}"`;
    answerText = pair.tr;
  }
  return {kind, simonSays, mainText, sub, answerText};
}

function simonUpdateTimerDisplay(){
  const s = state.simon;
  const ring = document.getElementById("simonTimerRing");
  const num = document.getElementById("simonTimerNum");
  if(!ring || !num) return;
  num.textContent = Math.max(0, s.timeLeft);
  ring.style.setProperty("--tpct", Math.max(0, (s.timeLeft/s.reactionTime)*100));
  ring.classList.toggle("low", s.timeLeft<=2);
}

function simonTick(){
  const s = state.simon;
  s.timeLeft--;
  simonUpdateTimerDisplay();
  if(s.timeLeft>0 && s.timeLeft<=3) playSound("tick");
  if(s.timeLeft<=0){
    simonClearTimer();
    playSound("timeup");
  }
}

function simonStartGame(){
  const s = state.simon;
  s.round = 0;
  s.turnIdx = -1;
  s.winnerIdx = null;
  s.lastResult = null;
  simonNextTurn();
}

function simonNextTurn(){
  const s = state.simon;
  do{
    s.turnIdx = (s.turnIdx+1) % s.players.length;
  } while(!s.players[s.turnIdx].alive);
  s.round++;
  s.reactionTime = Math.max(4, 8 - (s.round-1)*0.3); // gentle speed-up, floors at 4s
  if(simonAlivePlayers().length<=2) s.reactionTime = Math.max(3, s.reactionTime-1.5); // sudden death: even tighter
  s.timeLeft = Math.ceil(s.reactionTime);
  s.showAnswer = false;
  s.command = simonBuildCommand();
  state.screen = "simonGame";
  render();
  simonClearTimer();
  simonTimerInterval = setInterval(simonTick, 1000);
}

function simonJudgeTurn(passed){
  const s = state.simon;
  simonClearTimer();
  const player = s.players[s.turnIdx];
  if(passed){
    player.streak = (player.streak||0) + 1;
    playSound(player.streak>=3 ? "streak" : "correct");
  } else {
    player.alive = false;
    player.streak = 0;
    playSound("elim");
  }
  s.lastResult = {name:player.name, passed, streak:player.streak};
  render();
  setTimeout(()=>{
    s.lastResult = null;
    if(state.screen !== "simonGame") return;
    const alive = simonAlivePlayers();
    if(alive.length<=1){
      s.winnerIdx = alive.length===1 ? s.players.indexOf(alive[0]) : -1;
      state.screen = "simonResults";
      render();
      if(s.winnerIdx>=0) launchConfetti();
    } else {
      simonNextTurn();
    }
  }, passed ? 500 : 1100);
}

function traitBadges(ch){
  const b = [];
  if(!ch.hasHair) b.push("Bald");
  b.push(ch.isTall ? "Tall" : "Short");
  b.push(ch.isChubby ? "Chubby" : "Slim");
  return b;
}

/* ---------- Sound effects (synthesized, no audio files needed) ---------- */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended") _audioCtx.resume();
  return _audioCtx;
}
function beep(ctx, freq, startTime, duration, type, volume){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime+duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime+duration+0.02);
}
function playSound(type){
  if(!state.settings.soundOn) return;
  try{
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    if(type==="correct"){
      [523.25,659.25,783.99,1046.5].forEach((freq,i)=> beep(ctx, freq, now+i*0.12, 0.15, "triangle", 0.25));
    } else if(type==="wrong"){
      beep(ctx, 220, now, 0.25, "sawtooth", 0.22);
      beep(ctx, 160, now+0.18, 0.3, "sawtooth", 0.22);
    } else if(type==="yes"){
      beep(ctx, 880, now, 0.14, "sine", 0.2);
    } else if(type==="no"){
      beep(ctx, 300, now, 0.2, "square", 0.15);
    } else if(type==="click"){
      beep(ctx, 600, now, 0.05, "square", 0.1);
    } else if(type==="timeup"){
      beep(ctx, 200, now, 0.2, "sawtooth", 0.28);
      beep(ctx, 200, now+0.25, 0.2, "sawtooth", 0.28);
      beep(ctx, 200, now+0.5, 0.3, "sawtooth", 0.28);
    } else if(type==="tick"){
      beep(ctx, 950, now, 0.06, "square", 0.16);
    } else if(type==="elim"){
      beep(ctx, 190, now, 0.18, "sawtooth", 0.3);
      beep(ctx, 130, now+0.16, 0.35, "sawtooth", 0.32);
    } else if(type==="streak"){
      [660,880,1108].forEach((freq,i)=> beep(ctx, freq, now+i*0.09, 0.13, "triangle", 0.22));
    }
  }catch(e){ /* audio unsupported/blocked — fail silently */ }
}

/* ---------- Confetti (win celebration) ---------- */
function launchConfetti(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#a9762f","#3568a8","#a3454a","#2f8f57","#6d5b9e","#e0b84a"];
  for(let i=0; i<60; i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = (Math.random()*100) + "vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = (Math.random()*0.4) + "s";
    el.style.animationDuration = (2.2 + Math.random()*1.2) + "s";
    el.style.setProperty("--rot", Math.round(Math.random()*360) + "deg");
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 4200);
  }
}

/* ---------- Avatar SVG ---------- */
function avatarSVG(ch, size=100){
  const skin = SKIN_COLORS[ch.skin];
  const hair = ch.hasHair ? HAIR_COLORS[ch.hair] : null;
  const facialHairColor = hair || "#4a3222";
  const eye  = EYE_COLORS[ch.eyes];
  const cloth= CLOTH_COLORS[ch.cloth];
  const shoulderRx = ch.isChubby ? 44 : 33;
  const headR = ch.isChubby ? 42 : 40;

  const hairShape = (ch.hasHair && !ch.hasHat)
    ? `<path d="M24,44 Q60,2 96,44 L96,56 Q60,32 24,56 Z" fill="${hair}"/>` : "";
  const beard = ch.hasBeard
    ? `<path d="M34,72 Q60,102 86,72 L86,84 Q60,108 34,84 Z" fill="${facialHairColor}"/>` : "";
  const mustache = ch.hasMustache
    ? `<path d="M46,77 Q53,73 60,76 Q67,73 74,77 Q67,81 60,78.5 Q53,81 46,77 Z" fill="${facialHairColor}"/>` : "";
  const glasses = ch.hasGlasses
    ? `<g stroke="#222" stroke-width="3" fill="none"><circle cx="45" cy="62" r="11"/><circle cx="75" cy="62" r="11"/><line x1="56" y1="62" x2="64" y2="62"/></g>` : "";
  const hat = ch.hasHat
    ? `<path d="M20,44 Q60,0 100,44 L100,50 L20,50 Z" fill="#3f3f46"/><rect x="38" y="16" width="44" height="28" rx="4" fill="#3f3f46"/>` : "";
  const earrings = ch.hasEarrings
    ? `<circle cx="24" cy="66" r="3.2" fill="#f5c518"/><circle cx="96" cy="66" r="3.2" fill="#f5c518"/>` : "";
  const freckles = ch.hasFreckles
    ? `<circle cx="47" cy="74" r="1.6" fill="#8a5a3a"/><circle cx="52" cy="78" r="1.6" fill="#8a5a3a"/><circle cx="68" cy="78" r="1.6" fill="#8a5a3a"/><circle cx="73" cy="74" r="1.6" fill="#8a5a3a"/>` : "";
  return `<svg viewBox="0 0 120 148" width="${size}" height="${size*1.23}">
    <ellipse cx="60" cy="126" rx="${shoulderRx}" ry="24" fill="${cloth}"/>
    <circle cx="60" cy="62" r="${headR}" fill="${skin}"/>
    ${hairShape}
    <circle cx="45" cy="62" r="5.5" fill="${eye}"/>
    <circle cx="75" cy="62" r="5.5" fill="${eye}"/>
    <path d="M47,82 Q60,90 73,82" stroke="#7a4a35" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    ${freckles}
    ${mustache}
    ${beard}
    ${glasses}
    ${earrings}
    ${hat}
  </svg>`;
}

/* ---------- Render ---------- */
const HU_SCREENS = ["huPlatform","huSetup","huReady","huGame","huResults"];
const SIMON_SCREENS = ["simonSetup","simonGame","simonResults"];

function headerHTML(){
  if(state.screen==="modeSelect"){
    return `<h1>English Learning Games</h1><div class="subtitle">Choose a game mode to begin</div>`;
  }
  if(HU_SCREENS.includes(state.screen)){
    return `<h1>What Am I?</h1><div class="subtitle">Charades for English vocabulary practice</div>`;
  }
  if(SIMON_SCREENS.includes(state.screen)){
    return `<h1>Simon Says</h1><div class="subtitle">Only follow a command when it starts with "Simon says"</div>`;
  }
  return `<h1>Who Am I?</h1><div class="subtitle">A guessing game for English practice</div>`;
}

function askConfirm(message, actionName){
  state.pendingConfirm = {message, actionName};
  render();
}

function confirmDialogHTML(){
  if(!state.pendingConfirm) return "";
  return `
  <div class="modal-overlay">
    <div class="modal">
      <p style="font-weight:600;margin-top:0;">${escapeHtml(state.pendingConfirm.message)}</p>
      <div class="footer-actions">
        <button class="btn-gray" id="confirmDialogNoBtn">Cancel</button>
        <button class="btn-primary" id="confirmDialogYesBtn">Confirm</button>
      </div>
    </div>
  </div>`;
}

function render(){
  document.body.classList.toggle("projection-mode", !!state.settings.projectionMode);
  const app = document.getElementById("app");
  app.innerHTML = headerHTML() + `
    <div style="text-align:center;margin-bottom:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <button class="small-link" id="soundToggleBtn">${state.settings.soundOn ? "🔊 Sound On" : "🔇 Sound Off"}</button>
      <button class="small-link" id="projectionToggleBtn">🖥️ Big Screen ${state.settings.projectionMode ? "On" : "Off"}</button>
    </div>` + screenHTML() + confirmDialogHTML();
  attachHandlers();
}

function screenHTML(){
  switch(state.screen){
    case "modeSelect": return modeSelectScreen();
    case "setup": return setupScreen();
    case "pass1": return passScreen(1, "pick1");
    case "pick1": return pickScreen(1);
    case "pass2": return passScreen(2, "pick2");
    case "pick2": return pickScreen(2);
    case "ready": return readyScreen();
    case "game": return gameScreen();
    case "gameover": return gameOverScreen();
    case "huPlatform": return huPlatformScreen();
    case "huSetup": return huSetupScreen();
    case "huReady": return huReadyScreen();
    case "huGame": return huGameScreen();
    case "huResults": return huResultsScreen();
    case "simonSetup": return simonSetupScreen();
    case "simonGame": return simonGameScreen();
    case "simonResults": return simonResultsScreen();
    default: return "";
  }
}

        const meta = HU_CATEGORY_META[key];
        const sel = hu.category===key ? "selected" : "";
        return `<div class="category-card cat-${key} ${sel}" data-cat="${key}">
          <div class="icon">${meta.icon}</div>
          <div class="cat-name">${meta.label}</div>
          <div class="cat-hint">${meta.hint}</div>
        </div>`;
      }).join("")}
    </div>
    <p class="panel-title" style="margin-top:20px;">Round Length</p>
    <div class="action-row" id="huDurationRow">
      ${[30,60,90].map(sec=>`<button class="btn-${hu.duration===sec?'primary':'gray'}" data-sec="${sec}">${sec} sec</button>`).join("")}
    </div>
    <div class="footer-actions">
      <button class="btn-primary" id="huStartSetupBtn">Continue ➜</button>
    </div>
  </div>`;
}

function huReadyScreen(){
  const hu = state.headsup;
  const meta = HU_CATEGORY_META[hu.category];
  const counting = hu.prepCount !== null && hu.prepCount !== undefined;
  const tiltMode = hu.controlMode === "tilt";
  const holdText = tiltMode
    ? `Lift the phone, turn the screen outward, and press it to your forehead. Once the round starts, tilt <b>down</b> for a correct guess, tilt <b>up</b> to pass.`
    : `Lift the device, turn the screen outward, and let your friends read the word. Tap <b>Got It!</b> or <b>Pass</b> to move on.`;
  return `
  <div class="card center-card">
    <h2>${counting ? "Get ready…" : "Ready?"}</h2>
    <p style="color:var(--muted);">${meta.icon} <b>${meta.label}</b> · ${hu.duration} seconds. ${holdText}</p>
    ${hu.tiltUnavailable ? `<p style="color:var(--team2);font-size:.85em;">Tilt isn't available on this device — using buttons instead.</p>` : ""}
    ${counting
      ? `<div class="hu-prep-ring" style="--ppct:${(hu.prepCount/5)*100};"><div class="inner">${hu.prepCount}</div></div>`
      : `<button class="btn-primary" id="huReadyStartBtn">Start</button>`}
    <div class="footer-actions" style="margin-top:14px;">
      <button class="small-link" id="backToModesBtn">⟵ Back to Modes</button>
    </div>
  </div>`;
}

function huButtonControlsHTML(){
  return `
    <div class="hu-answer-row">
      <button class="hu-ans-btn pass" id="huPassBtn"><span class="mark">✕</span>Pass</button>
      <button class="hu-ans-btn hit" id="huHitBtn"><span class="mark">✓</span>Got It!</button>
    </div>`;
}

function huTiltControlsHTML(){
  const hu = state.headsup;
  return `
    <div class="hu-tilt-wrap">
      <div class="hu-tilt-gauge">
        <span class="tilt-label top">⬆ PASS</span>
        <div class="marker" id="huTiltMarker"></div>
        <span class="tilt-label bottom">⬇ GOT IT</span>
      </div>
      <p class="hu-tilt-hint">Tilt the phone <b>down</b> for a correct guess, <b>up</b> to pass.</p>
      <div class="footer-actions" style="margin-top:2px;">
        <button class="small-link" id="huSwapTiltBtn">${hu.tiltSwap ? "Directions swapped ✓ (tap to undo)" : "Feels backwards? Swap directions"}</button>
        <button class="small-link" id="huUseButtonsBtn">Use buttons instead</button>
      </div>
    </div>`;
}

function huGameScreen(){
  const hu = state.headsup;
  const meta = HU_CATEGORY_META[hu.category];
  const pct = hu.duration ? Math.max(0, (hu.timeLeft/hu.duration)*100) : 100;
  return `
  <div class="top-bar" style="grid-template-columns:auto 1fr auto;align-items:center;">
    <div style="font-weight:800;color:#fff;">${meta.icon} ${meta.label}</div>
    <div style="text-align:center;font-weight:800;color:#4ade80;">✓ ${hu.score}</div>
    <div class="hu-timer-ring ${hu.timeLeft<=10?'low':''}" id="huTimerRing" style="--tpct:${pct};"><div class="inner" id="huTimerNum">${hu.timeLeft}</div></div>
  </div>
  <div class="card">
    <div class="hu-word-stage"><div class="hu-word pop" id="huWordDisplay">${escapeHtml(hu.currentWord||"")}</div></div>
    ${hu.controlMode === "tilt" ? huTiltControlsHTML() : huButtonControlsHTML()}
    <div class="footer-actions" style="margin-top:16px;">
      <button class="small-link" id="huQuitBtn">End Round</button>
    </div>
  </div>`;
}

function huResultsScreen(){
  const hu = state.headsup;
  return `
  <div class="card center-card">
    <h2>Time's Up</h2>
    <div style="font-size:2.6em;font-weight:800;font-variant-numeric:tabular-nums;">${hu.score} <span style="font-size:.4em;color:var(--muted);font-weight:700;">correct</span></div>
    <div class="hu-lists">
      <div class="hu-list-card good">
        <h4>Got It</h4>
        <div class="hu-chip-wrap">${hu.hits.length ? hu.hits.map(w=>`<span class="hu-chip">${escapeHtml(w)}</span>`).join("") : `<span style="color:var(--muted);font-size:.85em;">None yet.</span>`}</div>
      </div>
      <div class="hu-list-card bad">
        <h4>Missed</h4>
        <div class="hu-chip-wrap">${hu.misses.length ? hu.misses.map(w=>`<span class="hu-chip">${escapeHtml(w)}</span>`).join("") : `<span style="color:var(--muted);font-size:.85em;">None — great job!</span>`}</div>
      </div>
    </div>
    <div class="footer-actions">
      <button class="btn-gray" id="backToModesBtn">Back to Modes</button>
      <button class="btn-primary" id="huPlayAgainBtn">Play Again</button>
    </div>
  </div>`;
}

function simonSetupScreen(){
  const s = state.simon;
  return `
  <div class="card">
    <button class="small-link" id="backToModesBtn" style="display:block;margin:0 auto 10px;">⟵ Back to Modes</button>
    <p style="text-align:center;color:var(--muted);margin-top:0;">Add players. Each round gives a command — only follow it if it starts with "Simon says"! Eliminate anyone who gets it wrong; last player standing wins.</p>
    <p class="panel-title">Players</p>
    <div id="simonPlayerList">
      ${s.players.map((p,i)=>`
        <div class="field" style="display:flex;gap:8px;align-items:flex-end;">
          <div style="flex:1;">
            <label>Player ${i+1}</label>
            <input type="text" class="simonPlayerInput" data-idx="${i}" value="${escapeHtml(p.name)}" placeholder="Name">
          </div>
          ${s.players.length>2 ? `<button class="btn-gray" data-remove="${i}" style="padding:10px 14px;">✕</button>` : ""}
        </div>`).join("")}
    </div>
    <div class="footer-actions" style="margin-bottom:10px;">
      <button class="btn-gray" id="simonAddPlayerBtn">+ Add Player</button>
    </div>
    <div class="footer-actions">
      <button class="btn-primary" id="simonStartBtn">Start ➜</button>
    </div>
  </div>`;
}

function simonGameScreen(){
  const s = state.simon;
  const cmd = s.command;
  const alive = simonAlivePlayers();
  const current = s.players[s.turnIdx];
  const pct = s.reactionTime ? Math.max(0, (s.timeLeft/s.reactionTime)*100) : 100;
  const lr = s.lastResult;

  return `
  <div class="top-bar" style="grid-template-columns:auto 1fr auto;align-items:center;">
    <div style="font-weight:800;color:#fff;">Round ${s.round}</div>
    <div style="text-align:center;font-weight:800;color:#fff;">${alive.length} players left</div>
    <div class="hu-timer-ring ${s.timeLeft<=2?'low':''}" id="simonTimerRing" style="--tpct:${pct};"><div class="inner" id="simonTimerNum">${Math.max(0,s.timeLeft)}</div></div>
  </div>
  <div class="card">
    <div class="hu-chip-wrap" style="justify-content:center;margin-bottom:16px;">
      ${s.players.map((p,i)=>`<span class="hu-chip" style="${!p.alive?'opacity:.4;text-decoration:line-through;':''}${i===s.turnIdx?'border-color:var(--accent);border-width:2px;font-weight:800;background:#fffbeb;':''}">${escapeHtml(p.name)}${p.alive && p.streak>=2 ? ` <span class="streak-badge">🔥${p.streak}</span>` : ""}</span>`).join("")}
    </div>
    <h2 style="text-align:center;margin:0 0 14px;">${escapeHtml(current.name)}'s turn</h2>

    ${lr ? `
      <div class="question-banner result-banner ${lr.passed?'pass':'fail'}">
        ${lr.passed
          ? `${escapeHtml(lr.name)} got it right!${lr.streak>=2 ? ` <span class="streak-badge">🔥 ${lr.streak} in a row</span>` : ""}`
          : `${escapeHtml(lr.name)} is out.`}
      </div>
    ` : `
      <div class="question-banner simon-reveal" ${cmd.simonSays ? "" : `style="background:#fee2e2;border-color:#dc2626;color:#7f1d1d;"`}>
        ${escapeHtml(cmd.mainText)}
        ${cmd.sub ? `<div style="margin-top:8px;font-size:1.1em;">${escapeHtml(cmd.sub)}</div>` : ""}
      </div>
      ${cmd.answerText ? `
        <div style="text-align:center;margin-bottom:14px;">
          ${s.showAnswer
            ? `<span style="font-weight:700;color:var(--green);">✓ ${escapeHtml(cmd.answerText)}</span>`
            : `<button class="small-link" id="simonShowAnswerBtn">Show Answer</button>`}
        </div>` : ""}
      <div class="hu-answer-row" style="margin-top:18px;">
        <button class="hu-ans-btn pass" id="simonFailBtn"><span class="mark">✕</span>Out</button>
        <button class="hu-ans-btn hit" id="simonPassBtn"><span class="mark">✓</span>Got It</button>
      </div>
    `}

    <div class="footer-actions" style="margin-top:18px;">
      <button class="small-link" id="restartBtn">End Game</button>
    </div>
  </div>`;
}

function simonResultsScreen(){
  const s = state.simon;
  const winner = (s.winnerIdx!==null && s.winnerIdx>=0) ? s.players[s.winnerIdx] : null;
  return `
  <div class="card center-card">
    <div class="winner-banner">${winner ? "🏆" : "🤝"}</div>
    <h2>${winner ? `${escapeHtml(winner.name)} wins!` : "Nobody's left — it's a tie!"}</h2>
    ${winner && winner.streak>=2 ? `<p style="margin:0 0 4px;">🔥 Final streak: <span class="streak-badge">${winner.streak}</span></p>` : ""}
    <p style="color:var(--muted);">${s.round} rounds played.</p>
    <div class="footer-actions">
      <button class="btn-gray" id="backToModesBtn">Back to Modes</button>
      <button class="btn-primary" id="simonPlayAgainBtn">Play Again</button>
    </div>
  </div>`;
}

function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Handlers ---------- */
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  $("#soundToggleBtn").onclick = ()=>{
    state.settings.soundOn = !state.settings.soundOn;
    render();
  };
  $("#projectionToggleBtn").onclick = ()=>{
    state.settings.projectionMode = !state.settings.projectionMode;
    render();
  };

  const backToModesBtn = $("#backToModesBtn");
  if(backToModesBtn) backToModesBtn.onclick = ()=>{
    huClearTimer();
    huClearPrep();
    huDetachTilt();
    clearTimeout(state.headsup.tiltFallbackTimer);
    simonClearTimer();
    state.screen = "modeSelect";
    render();
  };

  const confirmNoBtn = $("#confirmDialogNoBtn");
  if(confirmNoBtn) confirmNoBtn.onclick = ()=>{ state.pendingConfirm = null; render(); };
  const confirmYesBtn = $("#confirmDialogYesBtn");
  if(confirmYesBtn) confirmYesBtn.onclick = ()=>{
    const action = state.pendingConfirm && state.pendingConfirm.actionName;
    state.pendingConfirm = null;
    if(action === "restartWhoAmI"){
      fullReset();
    } else if(action === "endSimon"){
      simonClearTimer();
      state.screen = "modeSelect";
      render();
    } else if(action === "quitWhatAmI"){
      huClearTimer();
      huDetachTilt();
      clearTimeout(state.headsup.tiltFallbackTimer);
      state.screen = "modeSelect";
      render();
    } else {
      render();
    }
  };

  if(state.screen==="modeSelect"){
    $("#modeWhoBtn").onclick = ()=>{ state.screen = "setup"; render(); };
    $("#modeWhatBtn").onclick = ()=>{ state.screen = "huPlatform"; render(); };
    $("#modeSimonBtn").onclick = ()=>{ state.screen = "simonSetup"; render(); };
  }

  if(state.screen==="simonSetup"){
    const syncNames = ()=>{
      $$(".simonPlayerInput").forEach(inp=>{
        state.simon.players[Number(inp.dataset.idx)].name = inp.value;
      });
    };
    $("#simonAddPlayerBtn").onclick = ()=>{
      syncNames();
      state.simon.players.push({name:"", alive:true, streak:0});
      render();
    };
    $$("[data-remove]").forEach(btn=>{
      btn.onclick = ()=>{
        syncNames();
        state.simon.players.splice(Number(btn.dataset.remove), 1);
        render();
      };
    });
    $("#simonStartBtn").onclick = ()=>{
      syncNames();
      state.simon.players.forEach((p,i)=>{
        if(!p.name.trim()) p.name = `Player ${i+1}`;
        p.alive = true;
        p.streak = 0;
      });
      simonStartGame();
    };
  }

  if(state.screen==="simonGame"){
    const showAnsBtn = $("#simonShowAnswerBtn");
    if(showAnsBtn) showAnsBtn.onclick = ()=>{ state.simon.showAnswer = true; render(); };
    const passBtn = $("#simonPassBtn");
    if(passBtn) passBtn.onclick = ()=> simonJudgeTurn(true);
    const failBtn = $("#simonFailBtn");
    if(failBtn) failBtn.onclick = ()=> simonJudgeTurn(false);
    $("#restartBtn").onclick = ()=>{
      askConfirm("End the game and return to mode selection?", "endSimon");
    };
  }

  if(state.screen==="simonResults"){
    $("#simonPlayAgainBtn").onclick = ()=>{
      state.simon.players.forEach(p=>{ p.alive=true; p.streak=0; });
      simonStartGame();
    };
  }

  if(state.screen==="huPlatform"){
    $$(".category-card").forEach(card=>{
      card.onclick = ()=>{
        const platform = card.dataset.platform;
        state.headsup.platform = platform;
        state.headsup.controlMode = platform === "phone" ? "tilt" : "buttons";
        state.headsup.tiltUnavailable = false;
        state.screen = "huSetup";
        render();
      };
    });
  }

  if(state.screen==="huSetup"){
    $$(".category-card").forEach(card=>{
      card.onclick = ()=>{ state.headsup.category = card.dataset.cat; render(); };
    });
    $$("#huDurationRow button").forEach(btn=>{
      btn.onclick = ()=>{ state.headsup.duration = Number(btn.dataset.sec); render(); };
    });
    $("#huStartSetupBtn").onclick = ()=>{
      state.headsup.timeLeft = state.headsup.duration;
      state.headsup.prepCount = null;
      state.screen = "huReady";
      render();
    };
  }

  if(state.screen==="huReady"){
    const startBtn = $("#huReadyStartBtn");
    if(startBtn) startBtn.onclick = async ()=>{
      if(state.headsup.controlMode === "tilt"){
        const granted = await huRequestTiltPermission();
        if(!granted){
          state.headsup.controlMode = "buttons";
          state.headsup.tiltUnavailable = true;
        }
      }
      state.headsup.prepCount = 5;
      render();
      huRunPrep();
    };
  }

  if(state.screen==="huGame"){
    const hitBtn = $("#huHitBtn");
    if(hitBtn) hitBtn.onclick = ()=> huAnswer(true);
    const passBtn = $("#huPassBtn");
    if(passBtn) passBtn.onclick = ()=> huAnswer(false);
    const swapBtn = $("#huSwapTiltBtn");
    if(swapBtn) swapBtn.onclick = ()=>{ state.headsup.tiltSwap = !state.headsup.tiltSwap; render(); };
    const useButtonsBtn = $("#huUseButtonsBtn");
    if(useButtonsBtn) useButtonsBtn.onclick = ()=>{ huDetachTilt(); state.headsup.controlMode = "buttons"; render(); };
    $("#huQuitBtn").onclick = ()=>{
      askConfirm("End this round and go back to modes?", "quitWhatAmI");
    };
  }

  if(state.screen==="huResults"){
    $("#huPlayAgainBtn").onclick = ()=>{
      state.headsup.prepCount = null;
      state.headsup.timeLeft = state.headsup.duration;
      state.screen = "huReady";
      render();
    };
  }

  if(state.screen==="setup"){
    $("#startSetupBtn").onclick = ()=>{
      state.team1.name = $("#teamName1").value.trim() || "Team 1";
      state.team1.players = [$("#p1_0").value.trim(), $("#p1_1").value.trim()];
      state.team2.name = $("#teamName2").value.trim() || "Team 2";
      state.team2.players = [$("#p2_0").value.trim(), $("#p2_1").value.trim()];
      state.settings.turnSeconds = Number($("#turnSecondsSelect").value);
      state.screen = "pass1";
      render();
    };
  }

  if(state.screen==="pass1" || state.screen==="pass2"){
    $("#readyPickBtn").onclick = (e)=>{
      state.screen = e.target.dataset.next;
      render();
    };
  }

  if(state.screen==="pick1" || state.screen==="pick2"){
    const n = state.screen==="pick1" ? 1 : 2;
    $$(".char-card").forEach(card=>{
      card.onclick = ()=>{
        const id = Number(card.dataset.charid);
        if(n===1) state.pick1 = id; else state.pick2 = id;
        render();
      };
    });
    const btn = $("#confirmPickBtn");
    if(btn) btn.onclick = ()=>{
      state.screen = n===1 ? "pass2" : "ready";
      render();
    };
  }

  if(state.screen==="ready"){
    $("#startGameBtn").onclick = ()=>{
      state.screen = "game";
      state.activeTeam = 1;
      state.eliminated = {1:new Set(), 2:new Set()};
      state.turn = {catKey:"eyes", val:null, questionAsked:false, guessUsed:false, currentQuestion:null, guessMode:false, isYes:null, declared:null, correct:null, confirmed:false};
      state.wrongGuessMsg = null;
      startTimerForTurn();
      render();
    };
  }

  if(state.screen==="game"){
    // category tabs
    $$(".tab").forEach(tab=>{
      tab.onclick = ()=>{
        state.turn.catKey = tab.dataset.cat;
        state.turn.val = null;
        render();
      };
    });
    // swatches
    $$(".swatch").forEach(sw=>{
      sw.onclick = ()=>{
        if(state.turn.questionAsked || state.turn.guessUsed) return;
        state.turn.val = sw.dataset.val;
        render();
      };
    });
    // ask button
    const askBtn = $("#askBtn");
    if(askBtn) askBtn.onclick = ()=>{
      const cat = CATEGORIES.find(c=>c.key===state.turn.catKey);
      const target = getTarget();
      const isYes = cat.type==="color" ? (target[cat.key]===state.turn.val) : (target[cat.key]===true);
      state.turn.currentQuestion = cat.type==="color" ? cat.question(state.turn.val) : cat.question();
      state.turn.questionAsked = true;
      state.turn.isYes = isYes;
      state.turn.declared = null;
      state.turn.correct = null;
      state.turn.confirmed = false;
      state.wrongGuessMsg = null;
      playSound("click");
      render();
    };
    // defending team declares their spoken answer
    const declareAnswer = (val)=>{
      state.turn.declared = val;
      state.turn.correct = (val === state.turn.isYes);
      state.turn.confirmed = false;
      playSound(state.turn.correct ? "yes" : "no");
      render();
    };
    const declareYesBtn = $("#declareYesBtn");
    if(declareYesBtn) declareYesBtn.onclick = ()=> declareAnswer(true);
    const declareNoBtn = $("#declareNoBtn");
    if(declareNoBtn) declareNoBtn.onclick = ()=> declareAnswer(false);
    // reveal tick -> cross confirmation
    const revealBtn = $("#revealBtn");
    if(revealBtn) revealBtn.onclick = ()=>{
      state.turn.confirmed = true;
      playSound("click");
      render();
    };
    // guess button -> enter guess mode
    const guessBtn = $("#guessBtn");
    if(guessBtn) guessBtn.onclick = ()=>{
      state.turn.guessMode = true;
      state.wrongGuessMsg = null;
      render();
    };
    const cancelGuessBtn = $("#cancelGuessBtn");
    if(cancelGuessBtn) cancelGuessBtn.onclick = ()=>{
      state.turn.guessMode = false;
      render();
    };
    // suspect board clicks
    $$(".char-card").forEach(card=>{
      card.onclick = ()=>{
        const id = Number(card.dataset.charid);
        if(state.turn.guessMode){
          state.pendingGuess = id;
          pauseTimer();
          render();
        } else {
          const set = state.eliminated[state.activeTeam];
          if(set.has(id)) set.delete(id); else set.add(id);
          render();
        }
      };
    });
    // end turn
    $("#endTurnBtn").onclick = ()=> endTurn();
    // restart
    $("#restartBtn").onclick = ()=>{
      askConfirm("Restart the whole game and go back to setup?", "restartWhoAmI");
    };
  }

  // guess confirm modal
  const cancelConfirmBtn = $("#cancelConfirmBtn");
  if(cancelConfirmBtn) cancelConfirmBtn.onclick = ()=>{
    state.pendingGuess = null;
    resumeTimer();
    render();
  };
  const confirmGuessBtn = $("#confirmGuessBtn");
  if(confirmGuessBtn) confirmGuessBtn.onclick = ()=>{
    const guessId = state.pendingGuess;
    const target = state.activeTeam===1 ? state.pick2 : state.pick1;
    state.pendingGuess = null;
    state.turn.guessMode = false;
    state.turn.guessUsed = true;
    if(guessId === target){
      clearTimer();
      state.winner = state.activeTeam;
      state.screen = "gameover";
      playSound("correct");
      render();
      launchConfetti();
    } else {
      const wrongChar = CHARACTERS.find(c=>c.id===guessId);
      state.wrongGuessMsg = `Wrong — it's not ${wrongChar.name}. Turn passes to the other team.`;
      playSound("wrong");
      render();
      setTimeout(()=>{ endTurn(); }, 1600);
    }
  };

  if(state.screen==="gameover"){
    $("#playAgainBtn").onclick = ()=> fullReset();
  }
}

function endTurn(){
  state.activeTeam = state.activeTeam===1 ? 2 : 1;
  state.turn = {catKey:"eyes", val:null, questionAsked:false, guessUsed:false, currentQuestion:null, guessMode:false, isYes:null, declared:null, correct:null, confirmed:false};
  state.wrongGuessMsg = null;
  startTimerForTurn();
  render();
}

function fullReset(){
  clearTimer();
  const keepSettings = state.settings;
  const keepHeadsup = state.headsup;
  const keepSimon = state.simon;
  state = {
    screen: "setup",
    team1: {name:"Team 1", players:["Player A",""]},
    team2: {name:"Team 2", players:["Player C",""]},
    pick1: null, pick2: null,
    activeTeam: 1,
    eliminated: {1:new Set(), 2:new Set()},
    turn: {catKey:"eyes", val:null, questionAsked:false, guessUsed:false, currentQuestion:null, guessMode:false, isYes:null, declared:null, correct:null, confirmed:false},
    winner: null, pendingGuess:null, wrongGuessMsg:null, pendingConfirm:null,
    settings: keepSettings,
    timeLeft: null,
    headsup: keepHeadsup,
    simon: keepSimon,
  };
  render();
}

render();
</script>
</body>
</html>
